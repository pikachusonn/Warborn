<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Top-left to bottom-right ellipse -->
  <ellipse 
    cx="50" 
    cy="50" 
    rx="36" 
    ry="14" 
    fill="none" 
    stroke="#FFCC00" 
    stroke-width="5" 
    stroke-linecap="round" 
    transform="rotate(-25 50 50)" 
  />

  <!-- Top-right to bottom-left ellipse -->
  <ellipse 
    cx="50" 
    cy="50" 
    rx="36" 
    ry="14" 
    fill="none" 
    stroke="#FFCC00" 
    stroke-width="5" 
    stroke-linecap="round" 
    transform="rotate(25 50 50)" 
  />
</svg>

